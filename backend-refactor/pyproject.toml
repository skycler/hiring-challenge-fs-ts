[project]
name = "asset-api"
version = "0.1.0"
description = "Backend API for signals and asset data"
requires-python = "==3.11.14"
dependencies = [
    "fastapi==0.115.11",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.6",
    "pydantic-settings==2.7.1",
]

[dependency-groups]
dev = [
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
    "ruff==0.1.7",
    "httpx==0.25.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=models --cov=providers --cov=services --cov=routes --cov=settings --cov=app --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["models", "providers", "services", "routes", "settings", "app"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/routes/*.py" = ["B008"]  # Query() in function defaults is the FastAPI convention
"src/services/__init__.py" = ["B008"]  # Depends() in function defaults is the FastAPI convention

[tool.uv]
index-url = "https://pypi.org/simple"
