[project]
name = "asset-api"
version = "0.1.0"
description = "Backend API for signals and asset data"
requires-python = "==3.11.14"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "python-dateutil==2.8.2",
    "jinja2==3.1.2",
]

[dependency-groups]
dev = [
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
    "ruff==0.1.7",
    "httpx==0.25.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=models --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["models"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv]
index-url = "https://pypi.org/simple"
